<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리워드 콘텐츠</title>
  <link rel="icon" href="data:,">
  <style>
    /* 콘텐츠 화면(7-3): 연한 하늘색 배경, 큰 굵은 파란 제목, 하단 전체 폭 둥근 파랑 버튼, 숫자만 파랑 강조. 큰 글씨, 높은 글자 대비, 넉넉한 터치 영역, 폭 제한.
       하늘색 배경 위의 파랑 글씨는 #3b82f6로는 대비가 3:1에 못 미쳐서(2.8) 한 단계 진한 #2563eb(4.0)를 쓰고, 버튼 바탕에만 #3b82f6를 쓴다(흰 큰 글씨 3.7). */
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 0; padding: 16px; min-height: 100vh; background: linear-gradient(180deg, #bbe6fc 0%, #d3ecfc 100%) fixed; color: #292f3d; line-height: 1.45; word-break: keep-all; overflow-wrap: break-word; }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 40px; font-weight: 800; line-height: 1.2; text-align: center; color: #2563eb; margin: 16px 0 24px; }
    p { font-size: 22px; margin: 8px 0; }
    a:focus-visible, button:focus-visible { outline: 4px solid #f59e0b; outline-offset: 2px; }
    .back { display: inline-block; font-size: 22px; font-weight: bold; color: #292f3d; text-decoration: none; padding: 12px 0; }
    .num { color: #2563eb; font-weight: bold; }
    .box { background: #fff; border-radius: 28px; padding: 24px 22px; margin: 16px 0; text-align: center; box-shadow: 0 6px 20px rgba(41, 47, 61, 0.08); }
    #reward { color: #4b5563; margin: 0; }
    #state { font-size: 32px; font-weight: bold; line-height: 1.25; margin: 8px 0 0; }
    #limit { color: #4b5563; }
    #main { display: flex; flex-direction: column; min-height: calc(100vh - 32px); }
    #startButton { display: block; width: 100%; min-height: 72px; margin-top: auto; font-size: 28px; font-weight: bold; border-radius: 36px; border: 0; background: #3b82f6; color: #fff; cursor: pointer; }
    #startButton:disabled { background: #cbd5e1; color: #374151; cursor: default; }
    #ad { display: none; background: #fff; border-radius: 28px; padding: 28px 24px; margin-top: 24px; text-align: center; box-shadow: 0 6px 20px rgba(41, 47, 61, 0.08); }
    #ad .label { font-size: 26px; font-weight: bold; }
    .bar { height: 24px; background: #e5e7eb; border-radius: 12px; margin-top: 20px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: #3b82f6; }
    #adRemaining { font-size: 22px; color: #4b5563; margin: 14px 0 0; }
    /* 결과: 큰 글씨 한 줄(숫자만 파랑)과 하단 전체 폭 파랑 버튼 */
    #resultBox { display: none; position: relative; min-height: calc(100vh - 48px); margin: 0; padding: 0; background: transparent; box-shadow: none; }
    #result { font-size: 30px; font-weight: bold; text-align: center; margin: 0; padding-top: 140px; }
    #homeLink { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; padding: 22px; border-radius: 36px; background: #3b82f6; color: #fff; font-size: 26px; font-weight: bold; text-decoration: none; }
    #message { font-size: 20px; color: #b00020; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="main">
      <a class="back" href="home.html">← 홈으로</a>
      <h1 id="name"></h1>
      <div class="box">
        <p id="reward"></p>
        <p id="state"></p>
        <p id="limit"></p>
      </div>
      <button id="startButton" type="button" disabled>시작</button>
      <p id="message" role="alert"></p>
    </div>

    <!-- 광고 중에는 이 영역만 보인다. 건너뛰기 버튼과 다른 동작을 두지 않는다 (7-3). -->
    <div id="ad" aria-live="polite">
      <div class="label" id="adLabel"></div>
      <div class="bar"><div id="adProgress"></div></div>
      <p id="adRemaining"></p>
    </div>

    <div class="box" id="resultBox" role="status">
      <p id="result"></p>
      <a class="back" id="homeLink" href="home.html">홈으로 가기</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const contentID = Number(new URLSearchParams(location.search).get('contentID'));
    let content = null;
    let serverBaseMs = 0;
    let perfBase = 0;
    let started = false;

    const el = (id) => document.getElementById(id);

    function setMessage(text) { el('message').textContent = text; }
    // 로그인이 안 된 화면: "홈으로" 링크와 안내 한 줄만 남기고 보상 상자와 시작 버튼은 숨긴다.
    // (안내 문구 #message가 #main 안에 있어서 main 전체를 숨기면 안내도 같이 사라진다.)
    function showLoginNeeded() {
      setMessage(LOGIN_NEEDED);
      document.querySelector('.box').style.display = 'none';
      el('startButton').style.display = 'none';
    }

    // 숫자만 파랑으로 강조한다 (표시만 바꾼다). 글자는 DOM 노드로 넣어서 HTML로 해석되지 않는다.
    function setTextWithBlueNumbers(element, text) {
      element.textContent = '';
      for (const part of text.split(/(\d+)/)) {
        if (part === '') continue;
        if (/^\d+$/.test(part)) {
          const span = document.createElement('span');
          span.className = 'num';
          span.textContent = part;
          element.appendChild(span);
        } else {
          element.appendChild(document.createTextNode(part));
        }
      }
    }

    // 홈과 같은 방식으로 서버 시각 기준의 남은 시간을 계산한다 (기기 시계를 쓰지 않는다).
    function remainingMs() {
      const serverNow = serverBaseMs + (performance.now() - perfBase);
      return Date.parse(content.nextAvailableAt) - serverNow;
    }

    async function loadState() {
      const res = await api('/cooldowns');
      if (res.status === 401) {
        showLoginNeeded();
        return false;
      }
      if (!res.ok) {
        setMessage('상태를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.');
        return false;
      }
      serverBaseMs = Date.parse(res.body.serverTime);
      perfBase = performance.now();
      content = res.body.contents.find((c) => c.contentID === contentID) || null;
      if (!content) {
        setMessage('없는 콘텐츠예요.');
        return false;
      }
      el('name').textContent = content.name;
      el('reward').textContent = `받을 수 있는 보상: ${formatReward(content)}`;
      renderState();
      return true;
    }

    function renderState() {
      el('state').classList.toggle('ready', content.ready);
      if (content.ready) {
        el('state').textContent = '지금 할 수 있어요';
        el('startButton').disabled = started;
      } else if (content.remainingToday === 0) {
        // 하루 한도(M7)가 다 찼다. 서버가 ready=false와 다음 한국 00:00을 내려 준다.
        setTextWithBlueNumbers(el('state'), `오늘은 끝났어요. 내일 ${formatKstHHmm(content.nextAvailableAt)}에 다시 돼요`);
        el('startButton').disabled = true;
      } else {
        const left = Math.max(0, remainingMs());
        setTextWithBlueNumbers(el('state'), `${formatRemaining(left)} (${formatKstHHmm(content.nextAvailableAt)})`);
        el('startButton').disabled = true; // 서버도 claim에서 한 번 더 막는다
      }
      // 한도가 있고 아직 남았으면 남은 횟수를 보여 준다. 한도가 없거나(null) 다 찼으면 비운다.
      setTextWithBlueNumbers(el('limit'), formatLimitLine(content.remainingToday));
    }

    // 대기 중이면 1초마다 문구를 갱신하고, 0이 되면 서버에 다시 물어본다. 서버가 ready라고 할 때만 시작 버튼이 켜진다.
    setInterval(async () => {
      if (!content || content.ready || started) return;
      renderState();
      if (remainingMs() <= 0) await loadState();
    }, 1000);

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // 모의 광고: 건너뛰기 없이 adSeconds 동안 진행 막대만 보여 준다.
    async function playAd(ad) {
      el('main').style.display = 'none';
      el('ad').style.display = 'block';
      el('adLabel').textContent = ad.adFormat === 'video'
        ? `광고 재생 중 (${ad.advertiser})`
        : `앱 설치와 로그인을 마치는 중 (${ad.advertiser}, 모의)`;
      const start = performance.now();
      const total = ad.adSeconds * 1000;
      while (true) {
        const elapsed = performance.now() - start;
        el('adProgress').style.width = Math.min(100, (elapsed / total) * 100) + '%';
        const secondsLeft = Math.ceil((total - elapsed) / 1000);
        el('adRemaining').textContent = secondsLeft > 0 ? `${secondsLeft}초 남았어요` : '확인하는 중이에요';
        if (elapsed >= total) break;
        await sleep(100);
      }
    }

    // 완료 요청. 최소 시청 시간 전이라고 하면(too_early) 서버가 알려 준 시간만큼 기다렸다가 다시 보낸다.
    async function completeAd(impressionID) {
      for (let attempt = 0; attempt < 3; attempt++) {
        const res = await api(`/ads/impressions/${impressionID}/complete`, { method: 'POST' });
        if (res.ok) return true;
        if (res.status === 400 && res.body.error === 'too_early') {
          await sleep(res.body.retryAfterMs + 50);
          continue;
        }
        return false;
      }
      return false;
    }

    function finish(text) {
      el('ad').style.display = 'none';
      el('main').style.display = 'none';
      setTextWithBlueNumbers(el('result'), text);
      el('resultBox').style.display = 'block'; // role="status"라서 화면 읽기 도구가 결과 문구를 읽어 준다
    }

    async function onStart() {
      if (started) return; // 더블 클릭으로 광고가 두 번 시작되지 않게 한다
      started = true;
      el('startButton').disabled = true;
      setMessage('');

      const startRes = await api('/ads/impressions', { method: 'POST', body: JSON.stringify({ contentID }) });
      if (!startRes.ok) {
        started = false;
        setMessage('광고를 시작하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
        renderState();
        return;
      }
      const ad = startRes.body;
      await playAd(ad);

      if (!(await completeAd(ad.impressionID))) {
        finish('광고를 확인하지 못했어요. 홈에서 다시 시도해 주세요.');
        return;
      }
      const claimRes = await api(`/contents/${contentID}/claim`, {
        method: 'POST',
        body: JSON.stringify({ impressionID: ad.impressionID }),
      });
      await showClaimResult(claimRes);
    }

    async function showClaimResult(claimRes) {
      if (claimRes.ok) {
        const next = formatKstHHmm(claimRes.body.nextAvailableAt);
        const reward = formatReward({ rewardAmount: claimRes.body.amount, rewardType: claimRes.body.rewardType });
        const particle = claimRes.body.rewardType === 'ticket' ? '을' : '를'; // 티켓 2장"을", 6포인트"를"
        finish(`${reward}${particle} 받았어요. 다음은 ${next}부터`);
        return;
      }
      const code = claimRes.body.error;
      if (code === 'daily_limit_reached') {
        // 응답의 nextAvailableAt은 다음 한국 00:00이다 (7-4). 없으면 "적립하지 못했어요"로 떨어진다.
        finish(`오늘은 끝났어요. 내일 ${formatKstHHmm(claimRes.body.nextAvailableAt)}에 다시 돼요`);
        return;
      }
      if (code === 'cooldown_active') {
        // 응답의 nextAvailableAt과 서버 시각으로 남은 시간을 말한다 (기기 시계를 쓰지 않는다).
        await loadState();
        const left = Math.max(0, remainingMs());
        finish(left < 60000 ? '곧 할 수 있어요' : `${formatRemaining(left)}에 할 수 있어요`);
        return;
      }
      const messages = {
        ad_not_completed: '광고를 끝까지 봐야 받을 수 있어요.',
        impression_used: '이미 사용한 광고예요. 다시 시작해 주세요.',
        impression_not_found: '광고 기록을 찾지 못했어요. 다시 시작해 주세요.',
        content_mismatch: '다른 콘텐츠의 광고예요. 다시 시작해 주세요.',
        content_not_found: '없는 콘텐츠예요.',
      };
      finish(messages[code] || '적립하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    }

    el('startButton').addEventListener('click', onStart);

    (async function init() {
      if (!(await ensureToken())) {
        showLoginNeeded();
        return;
      }
      if (!Number.isInteger(contentID)) {
        setMessage('없는 콘텐츠예요.');
        return;
      }
      sendEvents([{ eventType: 'content_enter', contentID }]);
      await loadState();
    })();
  </script>
</body>
</html>
