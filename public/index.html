<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리워드 쿨타임</title>
  <link rel="icon" href="data:,">
  <style>
    /* 주 사용층(40~50대) 가정(1장): 큰 글씨, 높은 글자 대비, 넉넉한 터치 영역. 화면이 넓어도 폭을 제한한다. */
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 0; padding: 16px; background: #f4f5f7; color: #1f2328; line-height: 1.45; word-break: keep-all; overflow-wrap: break-word; }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 30px; margin: 8px 0 16px; }
    button { font-size: 22px; min-height: 56px; padding: 12px 24px; border-radius: 14px; border: 2px solid #1d4ed8; background: #fff; color: #1d4ed8; cursor: pointer; }
    button:disabled { border-color: #8a929c; color: #4b5563; background: #e9ecef; cursor: default; }
    a:focus-visible, button:focus-visible { outline: 4px solid #f59e0b; outline-offset: 2px; }
    [hidden] { display: none !important; }
    /* 하루 한도(M7): 오늘 남은 횟수. 글자색은 카드에서 상속한다. */
    .card .limit { font-size: 20px; margin-top: 8px; }
    .note { font-size: 18px; color: #4b5563; margin: 10px 0 22px; }
    /* M9: 쿨타임 목록 페이지로 가는 한 줄 진입점. 카드와 중복되는 목록은 홈에 넣지 않고 "다음에 끝나는 하나"만 보여 준다. */
    .entry { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 12px 18px; margin-bottom: 16px; background: #fff; border: 2px solid #3b82f6; border-radius: 18px; color: #292f3d; text-decoration: none; font-size: 20px; line-height: 1.35; }
    .entry:active { transform: scale(0.99); }
    .entry .title { font-weight: bold; }
    .entry .next { color: #1d4ed8; font-weight: bold; font-variant-numeric: tabular-nums; }
    .entry .arrow { flex: none; font-size: 40px; font-weight: bold; line-height: 1; color: #3b82f6; }
    .card { display: block; background: #fff; border: 2px solid #d0d5dd; border-radius: 18px; padding: 24px 22px; margin-bottom: 16px; color: inherit; text-decoration: none; }
    .card:active { transform: scale(0.99); }
    .card .name { font-size: 30px; font-weight: bold; }
    .card .reward { font-size: 20px; color: #4b5563; margin-top: 4px; }
    /* 남은 시간(상태 문구)은 28px 이상의 굵은 글씨. 시계 숫자는 폭이 흔들리지 않게 tabular-nums. */
    .card .status { font-size: 32px; font-weight: bold; line-height: 1.25; margin-top: 14px; font-variant-numeric: tabular-nums; }
    /* 지금 할 수 있는 카드: 진한 파란 배경에 흰 글씨 (색에만 의존하지 않고 문구도 "지금 할 수 있어요"). */
    .card.ready { border-color: #1d4ed8; background: #1d4ed8; color: #fff; box-shadow: 0 6px 16px rgba(29, 78, 216, 0.35); }
    .card.ready .reward { color: #dbeafe; }
    /* 쿨타임 중인 카드: 흐리게. 글자를 흐리게 하면 남은 시간을 읽기 어려워서, 배경과 테두리만 옅게 하고 글자는 진하게 둔다. */
    .card.waiting { background: #eceff3; border-color: #d0d5dd; }
    .card.waiting .name { color: #374151; }
    .card.waiting .status { color: #374151; }
    #message { font-size: 20px; color: #b00020; }
    #toast { position: fixed; left: 16px; right: 16px; bottom: 24px; max-width: 448px; margin: 0 auto; background: #1f2328; color: #fff; font-size: 24px; padding: 20px; border-radius: 16px; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>리워드 쿨타임</h1>
    <button id="alarmButton" type="button">알림 켜기</button>
    <p class="note">알림은 이 탭이 열려 있을 때만 떠요. 실제 앱 푸시는 지원하지 않아요.</p>
    <p id="message" role="alert"></p>
    <a id="entry" class="entry" href="cooldowns.html" hidden>
      <span><span class="title">내 쿨타임 한눈에 보기</span> · <span class="next" id="entryNext"></span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <div id="cards"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    // 서버 시각 기준 카운트다운 (7-1).
    // 응답의 serverTime을 기준점으로 잡고, 이후 흐른 시간은 performance.now() 차이로 센다.
    // 이유: 기기 시계(Date.now())를 바꿔도 남은 시간이 달라지지 않게 하기 위해서다 (FR-2).
    let contents = [];
    let serverBaseMs = 0;   // 응답 시점의 서버 시각 (ms)
    let perfBase = 0;       // 같은 시점의 performance.now()
    let refreshing = false;
    let retryAfterPerf = 0; // 서버가 아직 ready가 아니라고 하면 1초 뒤 다시 조회하기 위한 시각
    let sentInitialEvents = false;

    // 알림 판정(checkAlarms, showAlarm, showToast)은 목록 페이지와 같이 쓰므로 app.js에 있다 (7-2).

    function serverNowMs() {
      return serverBaseMs + (performance.now() - perfBase);
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      try {
        const res = await api('/cooldowns');
        if (res.status === 401) {
          showMessage('토큰이 없거나 올바르지 않아요. 주소 끝에 ?token=... 을 붙여 열어 주세요.');
          return;
        }
        if (!res.ok) {
          showMessage('상태를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.');
          return;
        }
        showMessage('');
        serverBaseMs = Date.parse(res.body.serverTime);
        perfBase = performance.now();
        contents = res.body.contents;
        render();
        sendInitialEvents();
        checkAlarms(contents);
      } finally {
        refreshing = false;
      }
    }

    // 로드 시 한 번만: home_enter 하나, 콘텐츠마다 cooldown_view 하나 (7-1).
    // 카운트다운이 끝나 다시 조회할 때는 보내지 않는다 (화면 진입이 아니다).
    function sendInitialEvents() {
      if (sentInitialEvents) return;
      sentInitialEvents = true;
      const events = [{ eventType: 'home_enter' }];
      for (const c of contents) {
        events.push({
          eventType: 'cooldown_view',
          contentID: c.contentID,
          payload: { ready: c.ready, nextAvailableAt: c.nextAvailableAt },
        });
      }
      sendEvents(events);
    }

    function showMessage(text) {
      document.getElementById('message').textContent = text;
    }

    function remainingMs(content) {
      return Date.parse(content.nextAvailableAt) - serverNowMs();
    }

    // 지금 할 수 있는 카드를 위에, 쿨타임 중인 카드를 아래에. 같은 그룹 안에서는 contentID 순.
    function sortedContents() {
      return [...contents].sort((a, b) => (b.ready - a.ready) || (a.contentID - b.contentID));
    }

    function render() {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      for (const content of sortedContents()) {
        const card = document.createElement('a');
        card.className = 'card ' + (content.ready ? 'ready' : 'waiting');
        card.href = `content.html?contentID=${content.contentID}`;
        card.dataset.contentId = content.contentID;
        card.innerHTML = '<div class="name"></div><div class="reward"></div><div class="status"></div><div class="limit"></div>';
        card.querySelector('.name').textContent = content.name;
        card.querySelector('.reward').textContent = formatReward(content);
        container.appendChild(card);
      }
      document.getElementById('entry').hidden = false;
      updateStatusTexts();
    }

    function updateStatusTexts() {
      for (const content of contents) {
        const card = document.querySelector(`[data-content-id="${content.contentID}"]`);
        if (!card) continue;
        const status = card.querySelector('.status');
        const limit = card.querySelector('.limit');
        // 하루 한도(M7): remainingToday가 0이면 서버가 ready=false와 다음 한국 00:00을 내려 준다.
        const limitReached = content.remainingToday === 0;
        if (content.ready) {
          status.textContent = '지금 할 수 있어요';
        } else if (limitReached) {
          status.textContent = `오늘은 끝났어요. 내일 ${formatKstHHmm(content.nextAvailableAt)}에 다시 돼요`;
        } else {
          // M9: "다음 가능까지 59:49" (1시간 이상은 05:25:20). 출석체크는 "다음 출석까지".
          status.textContent = `${clockLabel(content)} ${formatClock(remainingMs(content))}`;
        }
        // 한도가 없으면(null) 보여 주지 않고, 다 찼으면 위 문구가 이미 말해 준다.
        limit.textContent = formatLimitLine(content.remainingToday);
      }
      updateEntry();
    }

    // 진입점 한 줄: 쿨타임 중인 것 가운데 가장 먼저 끝나는 하나를 1초마다 줄어들게 보여 준다.
    function updateEntry() {
      const next = nextToFinish(contents);
      document.getElementById('entryNext').textContent = next === null
        ? '지금 모두 할 수 있어요'
        : `다음: ${next.name} ${formatClock(remainingMs(next))}`;
    }

    // 1초마다 문구를 갱신한다. 남은 시간이 0이 되면 서버에 다시 물어보고,
    // 서버가 ready라고 할 때만 "지금 할 수 있어요"로 바꾼다 (화면 시계만 믿지 않는다).
    setInterval(() => {
      if (contents.length === 0) return;
      updateStatusTexts();
      const expired = contents.some((c) => !c.ready && remainingMs(c) <= 0);
      // 서버 응답에서도 아직 지난 시각이면 1초 간격으로 다시 조회한다.
      if (expired && performance.now() >= retryAfterPerf) {
        retryAfterPerf = performance.now() + 1000;
        refresh();
      }
    }, 1000);

    // 탭이 다시 보일 때도 서버 값으로 화면을 맞춘다. 숨겨진 탭에서는 타이머가 느려질 수 있기 때문이다.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refresh();
    });

    // 알림 켜기 버튼 (7-2).
    const alarmButton = document.getElementById('alarmButton');
    function updateAlarmButton() {
      if (!window.Notification) {
        alarmButton.textContent = '이 브라우저는 알림을 지원하지 않아요 (화면 안내로 알려 드려요)';
        alarmButton.disabled = true;
      } else if (Notification.permission === 'granted') {
        alarmButton.textContent = '알림이 켜져 있어요';
        alarmButton.disabled = true;
      } else if (Notification.permission === 'denied') {
        alarmButton.textContent = '알림이 꺼져 있어요 (화면 안내로 알려 드려요)';
        alarmButton.disabled = true;
      }
    }
    alarmButton.addEventListener('click', async () => {
      await Notification.requestPermission();
      updateAlarmButton();
    });
    updateAlarmButton();

    if (!token) {
      showMessage('토큰이 없어요. 주소 끝에 ?token=... 을 붙여 열어 주세요. (개발용: /dev/token?userID=1)');
    } else {
      refresh();
    }
  </script>
</body>
</html>
